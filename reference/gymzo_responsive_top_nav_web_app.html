<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GYMZO — Responsive Top Navigation Web App</title>
<style>
/*
  GYMZO PERFORMANCE MINIMALISM + RESPONSIVE WEB
  ----------------------------
  Dark:  #0B0F0C + #141A15 + #B7F000
  Light: #F7F8F5 + #FFFFFF + #B7F000
  Accent usage: primary CTAs, selected states, progress, key metrics only.
  Product flows retained: Guest, Personal, Member, Owner/Admin.
*/
:root{
  /* GYMZO — Performance Minimalism / Light */
  --accent:#B7F000;
  --accent-strong:#79A900;
  --accent-2:#8BC400;
  --accent-soft:#F0F7DA;

  --bg:#F7F8F5;
  --surface:#FFFFFF;
  --surface-2:#EEF2EA;
  --surface-3:#E6ECE1;

  --text:#11150F;
  --muted:#70796D;
  --border:#DDE3D9;

  --danger:#E45858;
  --danger-soft:#FDEBEB;
  --warning:#F2B13A;
  --warning-soft:#FFF3D7;
  --success:#68B80E;
  --success-soft:#EAF6DA;

  --shadow:0 12px 34px rgba(24,31,20,.08);
  --shadow-soft:0 4px 14px rgba(24,31,20,.05);
  --ring:0 0 0 3px rgba(183,240,0,.18);
}
body.dark{
  /* GYMZO — Performance Minimalism / Dark */
  --accent:#B7F000;
  --accent-strong:#9AD100;
  --accent-2:#9ED800;
  --accent-soft:#202C09;

  --bg:#0B0F0C;
  --surface:#141A15;
  --surface-2:#1A211B;
  --surface-3:#202820;

  --text:#F5F7F3;
  --muted:#8E978B;
  --border:#283028;

  --danger:#E45858;
  --danger-soft:#321A1A;
  --warning:#F2B13A;
  --warning-soft:#33270E;
  --success:#8CCF2C;
  --success-soft:#1B2B0D;

  --shadow:0 18px 48px rgba(0,0,0,.34);
  --shadow-soft:0 6px 18px rgba(0,0,0,.22);
  --ring:0 0 0 3px rgba(183,240,0,.16);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
#app{
  min-height:100dvh;
  max-width:480px;
  margin:0 auto;
  background:var(--bg);
  position:relative;
  overflow-x:hidden;
}
.safe-top{height:max(12px,env(safe-area-inset-top))}
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;
  background:color-mix(in srgb,var(--bg) 88%, transparent);
  backdrop-filter:blur(18px);
  border-bottom:1px solid color-mix(in srgb,var(--border) 70%, transparent);
}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:-.4px}
.logo-mark{
  width:34px;height:34px;border-radius:10px;background:var(--accent);color:#111;
  display:grid;place-items:center;font-weight:1000;transform:skewX(-8deg);
  box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 30%, transparent);
}
.icon-btn{
  width:40px;height:40px;border:1px solid var(--border);background:var(--surface);
  border-radius:13px;display:grid;place-items:center;color:var(--text)
}
.theme-toggle{font-size:18px}
.content{padding:18px 18px 102px}
.hero{
  background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 90%, #fff 10%),var(--accent));
  color:#10140d;border-radius:28px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden
}
.hero:after{
  content:"";position:absolute;width:180px;height:180px;border-radius:50%;
  right:-60px;bottom:-75px;background:rgba(255,255,255,.22)
}
.hero h1{margin:0 0 8px;font-size:30px;line-height:1.05;letter-spacing:-1.3px}
.hero p{margin:0;max-width:310px;line-height:1.5;color:#243000}
.section-title{margin:24px 2px 12px;display:flex;justify-content:space-between;align-items:end}
.section-title h2{margin:0;font-size:18px;letter-spacing:-.35px}
.section-title span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:16px;
  box-shadow:0 5px 18px rgba(20,26,16,.04)
}
.card.flat{box-shadow:none}
.card h3{margin:0 0 6px;font-size:16px}
.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.metric{font-size:26px;font-weight:850;letter-spacing:-1px}
.metric small{font-size:12px;font-weight:650;color:var(--muted)}
.badge{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 9px;
  font-size:11px;font-weight:750;background:var(--surface-2);color:var(--text)
}
.badge.accent{background:var(--accent-soft);color:color-mix(in srgb,var(--accent-2) 72%, #1b2a00)}
.badge.success{background:#eaf7dd;color:#3f7800}
.badge.warning{background:#fff1ce;color:#996000}
.badge.danger{background:#ffe6e6;color:#b32727}
.cta{
  width:100%;border:none;background:var(--accent);color:#10130d;font-weight:850;
  border-radius:15px;padding:14px 16px;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 18%, transparent)
}
.cta.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);box-shadow:none}
.cta.ghost{background:transparent;color:var(--text);border:1px dashed var(--border);box-shadow:none}
.cta.danger{background:#ffe8e8;color:#b12929}
.action-card{padding:18px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.action-icon{
  width:45px;height:45px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;
  font-size:22px;margin-bottom:22px
}
.action-card .cta{padding:11px 12px;font-size:13px}
.list{display:flex;flex-direction:column;gap:10px}
.row{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:13px 14px;
  display:flex;align-items:center;gap:12px
}
.row .avatar{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);
  font-weight:800;flex:0 0 auto;color:color-mix(in srgb,var(--accent-2) 80%, #122000)
}
.row-main{flex:1;min-width:0}
.row-title{font-weight:750;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12px;color:var(--muted);margin-top:2px}
.chev{color:var(--muted);font-size:20px}
.search{
  width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);
  border-radius:15px;padding:13px 14px;outline:none
}
.tabs{
  display:flex;gap:8px;background:var(--surface-2);padding:5px;border-radius:15px
}
.tab{flex:1;border:none;border-radius:11px;padding:9px;background:transparent;color:var(--muted);font-weight:700;font-size:12px}
.tab.active{background:var(--accent);color:#111}
.form{display:flex;flex-direction:column;gap:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 2px}
.field input,.field select,.field textarea{
  width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);
  border-radius:14px;padding:13px 14px;outline:none
}
.field textarea{min-height:86px;resize:vertical}
.auth-wrap{padding:24px 20px 110px;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo .brand{font-size:34px;font-weight:950;letter-spacing:-1.6px}
.auth-logo .tagline{color:var(--muted);font-size:13px;margin-top:5px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:20px;box-shadow:var(--shadow)}
.auth-card h1{font-size:24px;margin:0 0 6px}
.auth-card p{margin:0 0 18px;color:var(--muted)}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0}
.divider:before,.divider:after{content:"";height:1px;flex:1;background:var(--border)}
.socials{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link-btn{border:none;background:transparent;color:var(--accent-2);font-weight:800;padding:8px}
.bottom-nav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;
  width:min(480px,100%);padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
  background:color-mix(in srgb,var(--surface) 94%, transparent);
  border-top:1px solid var(--border);backdrop-filter:blur(18px)
}
.nav-btn{
  border:none;background:transparent;color:var(--muted);padding:6px 2px;border-radius:13px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px
}
.nav-btn .ico{font-size:18px}
.nav-btn.active{color:var(--accent-2);font-weight:800;background:var(--accent-soft)}
.owner-highlight{
  background:linear-gradient(150deg,var(--surface),color-mix(in srgb,var(--accent-soft) 45%,var(--surface)));
}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px}
.kpi .label{font-size:11px;color:var(--muted);margin-bottom:6px}
.kpi .value{font-size:22px;font-weight:850}
.spark{
  height:68px;display:flex;align-items:end;gap:6px;padding:8px 2px 0
}
.spark i{flex:1;background:var(--accent);border-radius:6px 6px 2px 2px;min-width:8px}
.qr{
  width:210px;aspect-ratio:1;margin:16px auto;background:
  linear-gradient(90deg,#111 12%,transparent 12% 24%,#111 24% 36%,transparent 36% 48%,#111 48% 60%,transparent 60% 72%,#111 72% 84%,transparent 84%),
  linear-gradient(#111 12%,transparent 12% 24%,#111 24% 36%,transparent 36% 48%,#111 48% 60%,transparent 60% 72%,#111 72% 84%,transparent 84%);
  background-size:28px 28px;border:12px solid var(--surface);outline:4px solid var(--accent);border-radius:18px
}
body.dark .qr{filter:invert(0)}
.progress{height:9px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:999px}
.switcher{
  display:flex;gap:8px;overflow:auto;padding-bottom:2px
}
.context-pill{
  white-space:nowrap;border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:999px;padding:9px 12px;font-size:12px;font-weight:750
}
.context-pill.active{background:var(--accent);color:#111;border-color:var(--accent)}
.notice{
  border:1px solid color-mix(in srgb,var(--accent) 45%,var(--border));
  background:var(--accent-soft);border-radius:18px;padding:14px;font-size:13px;line-height:1.5
}
.floating-add{
  position:fixed;right:max(20px,calc((100vw - 480px)/2 + 20px));bottom:92px;
  width:56px;height:56px;border-radius:18px;border:none;background:var(--accent);font-size:28px;font-weight:700;
  box-shadow:0 14px 30px color-mix(in srgb,var(--accent) 25%, transparent);z-index:25
}
.screen-title{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.screen-title h1{font-size:24px;margin:0;letter-spacing:-.7px}
.back{border:none;background:transparent;color:var(--text);font-size:24px;padding:0 5px 0 0}
.small{font-size:12px;color:var(--muted)}
.center{text-align:center}
.hidden{display:none!important}

.launch-splash{
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  padding:28px;
  background:
    radial-gradient(circle at 50% 36%, color-mix(in srgb,var(--accent) 16%, transparent), transparent 34%),
    var(--bg);
}
.launch-splash:before{
  content:"";
  position:absolute;
  width:330px;
  height:330px;
  border-radius:50%;
  border:1px solid color-mix(in srgb,var(--accent) 15%, transparent);
  animation:launchRing 2s ease-out infinite;
}
.launch-brand{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}
.launch-logo{
  width:84px;
  height:84px;
  border-radius:27px;
  display:grid;
  place-items:center;
  background:var(--accent);
  color:#10130d;
  font-size:42px;
  font-weight:1000;
  transform:skewX(-8deg);
  box-shadow:0 20px 50px color-mix(in srgb,var(--accent) 28%, transparent);
  animation:launchLogo 1.45s cubic-bezier(.2,.8,.2,1) infinite alternate;
}
.launch-name{
  margin-top:22px;
  font-size:38px;
  line-height:1;
  font-weight:950;
  letter-spacing:-2px;
}
.launch-tagline{
  margin-top:9px;
  color:var(--muted);
  font-size:13px;
  letter-spacing:.2px;
}
.launch-loader{
  margin-top:42px;
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:center;
}
.launch-loader i{
  width:8px;
  height:8px;
  border-radius:999px;
  background:var(--accent);
  opacity:.25;
  animation:launchDot 1s infinite ease-in-out;
}
.launch-loader i:nth-child(2){animation-delay:.14s}
.launch-loader i:nth-child(3){animation-delay:.28s}
.launch-status{
  margin-top:14px;
  font-size:11px;
  color:var(--muted);
  letter-spacing:.3px;
}
@keyframes launchLogo{
  from{transform:skewX(-8deg) scale(.96) translateY(2px)}
  to{transform:skewX(-8deg) scale(1.03) translateY(-3px)}
}
@keyframes launchDot{
  0%,80%,100%{opacity:.22;transform:translateY(0)}
  40%{opacity:1;transform:translateY(-5px)}
}
@keyframes launchRing{
  0%{transform:scale(.72);opacity:.65}
  100%{transform:scale(1.12);opacity:0}
}


.guest-chip{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:999px;
  padding:8px 11px;
  font-size:12px;
  font-weight:800;
}
.top-actions{display:flex;align-items:center;gap:8px}
.guest-hero{
  border-radius:28px;
  padding:22px;
  color:#10140d;
  background:
    radial-gradient(circle at 92% 12%,rgba(255,255,255,.7),transparent 23%),
    linear-gradient(145deg,color-mix(in srgb,var(--accent) 88%,#fff 12%),var(--accent));
  box-shadow:var(--shadow);
  overflow:hidden;
  position:relative;
}
.guest-hero h1{margin:12px 0 8px;font-size:31px;line-height:1.05;letter-spacing:-1.3px}
.guest-hero p{margin:0;color:#293500;line-height:1.5;max-width:330px}
.search-wrap{display:flex;gap:9px;margin-top:14px}
.search-wrap .search{flex:1}
.round-go{
  width:48px;height:48px;border:none;border-radius:15px;background:var(--accent);
  color:#111;font-size:20px;font-weight:900
}
.h-scroll{
  display:flex;gap:12px;overflow-x:auto;padding:2px 1px 6px;
  scroll-snap-type:x proximity;scrollbar-width:none
}
.h-scroll::-webkit-scrollbar{display:none}
.gym-card{
  min-width:245px;max-width:245px;
  background:var(--surface);border:1px solid var(--border);border-radius:22px;overflow:hidden;
  scroll-snap-align:start;box-shadow:0 5px 18px rgba(20,26,16,.04)
}
.gym-cover{
  height:110px;padding:14px;display:flex;align-items:flex-end;justify-content:space-between;
  background:
    radial-gradient(circle at 82% 20%,color-mix(in srgb,var(--accent) 45%,transparent),transparent 28%),
    linear-gradient(145deg,var(--surface-2),color-mix(in srgb,var(--accent-soft) 55%,var(--surface-2)));
}
.gym-cover .big-icon{font-size:43px;filter:grayscale(.1)}
.gym-body{padding:14px}
.gym-body h3{margin:0 0 4px;font-size:16px}
.gym-meta{font-size:12px;color:var(--muted);line-height:1.5}
.gym-actions{display:flex;gap:8px;margin-top:12px}
.gym-actions .cta{padding:10px;font-size:12px}
.category-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.category-card{
  min-height:94px;border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:18px;padding:12px;text-align:left
}
.category-card .emoji{font-size:24px;display:block;margin-bottom:12px}
.category-card strong{font-size:12px}
.feature-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feature-tile{
  border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:15px;min-height:132px;
  display:flex;flex-direction:column;justify-content:space-between
}
.feature-tile .feature-icon{
  width:42px;height:42px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;font-size:21px
}
.feature-tile h3{margin:18px 0 4px;font-size:14px}
.feature-tile p{font-size:11px;color:var(--muted);margin:0}
.soft-cta-card{
  border:1px solid color-mix(in srgb,var(--accent) 30%,var(--border));
  background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--accent-soft) 55%,var(--surface)));
  border-radius:22px;padding:17px
}
.soft-cta-card h3{margin:0 0 5px}
.soft-cta-card p{margin:0 0 13px;color:var(--muted);font-size:12px;line-height:1.45}
.auth-backdrop{
  position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);
  display:flex;align-items:flex-end;justify-content:center
}
.auth-sheet{
  width:min(480px,100%);background:var(--surface);border:1px solid var(--border);
  border-radius:28px 28px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -22px 60px rgba(0,0,0,.28)
}
.sheet-handle{width:42px;height:4px;background:var(--border);border-radius:999px;margin:0 auto 18px}
.auth-sheet .sheet-icon{
  width:52px;height:52px;border-radius:17px;background:var(--accent-soft);display:grid;place-items:center;font-size:25px
}
.auth-sheet h2{margin:14px 0 6px;font-size:23px;letter-spacing:-.6px}
.auth-sheet p{margin:0 0 16px;color:var(--muted);line-height:1.5;font-size:13px}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sheet-later{margin-top:8px;width:100%;border:none;background:transparent;color:var(--muted);padding:10px;font-weight:750}
.public-banner{
  display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--border);border-radius:18px;padding:12px 13px;margin-bottom:14px
}
.public-banner .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.detail-cover{
  height:190px;border-radius:24px;padding:18px;display:flex;align-items:flex-end;
  background:
    radial-gradient(circle at 70% 25%,color-mix(in srgb,var(--accent) 55%,transparent),transparent 24%),
    linear-gradient(145deg,var(--surface-2),color-mix(in srgb,var(--accent-soft) 75%,var(--surface-2)));
  border:1px solid var(--border);position:relative;overflow:hidden
}
.detail-cover .cover-icon{font-size:70px;position:absolute;right:18px;top:24px}
.detail-cover h1{margin:0;font-size:27px;letter-spacing:-.9px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.price{font-size:22px;font-weight:900;letter-spacing:-.6px}
.save-btn{
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:14px;padding:10px 12px;font-weight:800
}
.save-btn.saved{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,var(--border));color:var(--accent-2)}
.guest-profile-card{
  border-radius:25px;padding:22px;background:var(--surface);border:1px solid var(--border);text-align:center
}
.guest-profile-card .person{
  width:72px;height:72px;border-radius:50%;margin:0 auto 12px;
  display:grid;place-items:center;background:var(--accent-soft);font-size:30px
}
.empty-state{text-align:center;padding:38px 18px}
.empty-state .emoji{font-size:48px;margin-bottom:12px}
.empty-state h3{margin:0 0 6px}
.empty-state p{margin:0 auto 16px;color:var(--muted);font-size:13px;max-width:260px;line-height:1.5}


/* ==============================================================
   GYMZO PERFORMANCE MINIMALISM — COMPONENT OVERRIDES
   Neutral surfaces + controlled lime accents. No blue anywhere.
   ============================================================== */

html,body{
  background:var(--bg);
  color:var(--text);
  letter-spacing:-.01em;
}
#app{background:var(--bg)}

.topbar{
  background:color-mix(in srgb,var(--bg) 90%, transparent);
  border-bottom:1px solid color-mix(in srgb,var(--border) 86%, transparent);
}
.logo-mark{
  background:var(--accent);
  color:#11150F;
  border-radius:11px;
  box-shadow:none;
}
.icon-btn{
  background:var(--surface);
  border-color:var(--border);
  box-shadow:var(--shadow-soft);
}
.icon-btn:active{transform:scale(.97)}

.content{padding-top:16px}

/* Main dashboard / membership hero */
.hero{
  color:var(--text);
  border:1px solid color-mix(in srgb,var(--accent) 24%,var(--border));
  background:
    radial-gradient(circle at 92% 8%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 32%),
    linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--accent-soft) 42%,var(--surface)));
  border-radius:24px;
  box-shadow:var(--shadow-soft);
}
.hero:before{
  content:"";
  position:absolute;
  left:22px;
  right:22px;
  top:0;
  height:3px;
  border-radius:0 0 999px 999px;
  background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 15%,transparent));
}
.hero:after{display:none}
.hero p{color:var(--muted)}

/* Guest hero follows the same product language */
.guest-hero{
  color:var(--text);
  border:1px solid color-mix(in srgb,var(--accent) 26%,var(--border));
  background:
    radial-gradient(circle at 90% 10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 31%),
    linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--accent-soft) 50%,var(--surface)));
  box-shadow:var(--shadow-soft);
  border-radius:24px;
}
.guest-hero p{color:var(--muted)}
.guest-hero .badge{
  background:var(--accent-soft)!important;
  color:var(--accent-strong)!important;
}
.guest-hero:after{
  content:"";
  position:absolute;
  width:150px;height:150px;
  border:1px solid color-mix(in srgb,var(--accent) 14%,transparent);
  border-radius:50%;
  right:-58px;bottom:-72px;
}

/* Surfaces */
.card,.row,.kpi,.auth-card,.guest-profile-card,.soft-cta-card,.public-banner{
  border-color:var(--border);
  background:var(--surface);
  box-shadow:var(--shadow-soft);
}
.card,.row,.kpi{border-radius:18px}
.card:hover,.row:hover{border-color:color-mix(in srgb,var(--accent) 24%,var(--border))}
.owner-highlight,.soft-cta-card{
  background:
    linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--accent-soft) 36%,var(--surface)));
}
.action-card{min-height:146px}
.action-icon,.feature-tile .feature-icon{
  background:var(--accent-soft);
  color:var(--accent-strong);
  border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);
}

/* CTAs — lime is reserved for important actions */
.cta{
  background:var(--accent);
  color:#10140D;
  border-radius:13px;
  box-shadow:none;
  font-weight:850;
  letter-spacing:.01em;
}
.cta:hover{filter:brightness(.97)}
.cta:active{transform:translateY(1px)}
.cta.secondary{
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--border);
}
.cta.ghost{
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
}
.cta.danger{
  background:var(--danger-soft);
  color:var(--danger);
  border:1px solid color-mix(in srgb,var(--danger) 20%,var(--border));
}
.round-go,.floating-add{
  background:var(--accent);
  color:#10140D;
  box-shadow:none;
}

/* Inputs */
.search,.field input,.field select,.field textarea{
  background:var(--surface);
  border-color:var(--border);
  color:var(--text);
  box-shadow:none;
}
.search:focus,.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--accent-2);
  box-shadow:var(--ring);
}
.search::placeholder,.field input::placeholder,.field textarea::placeholder{color:var(--muted)}

/* Navigation and selection */
.tabs{
  background:var(--surface-2);
  border:1px solid var(--border);
}
.tab{color:var(--muted)}
.tab.active{
  background:var(--accent);
  color:#10140D;
  box-shadow:none;
}
.context-pill,.guest-chip,.save-btn{
  background:var(--surface);
  border-color:var(--border);
  color:var(--text);
}
.context-pill.active{
  background:var(--accent);
  color:#10140D;
  border-color:var(--accent);
}
.save-btn.saved{
  background:var(--accent-soft);
  border-color:color-mix(in srgb,var(--accent) 34%,var(--border));
  color:var(--accent-strong);
}
.bottom-nav{
  background:color-mix(in srgb,var(--surface) 95%,transparent);
  border-top-color:var(--border);
  box-shadow:0 -8px 26px color-mix(in srgb,#000 8%,transparent);
}
.nav-btn{color:var(--muted)}
.nav-btn.active{
  color:var(--accent-strong);
  background:var(--accent-soft);
}

/* Status language */
.badge{
  background:var(--surface-2);
  color:var(--text);
}
.badge.accent{
  background:var(--accent-soft);
  color:var(--accent-strong);
}
.badge.success{
  background:var(--success-soft);
  color:var(--success);
}
.badge.warning{
  background:var(--warning-soft);
  color:var(--warning);
}
.badge.danger{
  background:var(--danger-soft);
  color:var(--danger);
}
.notice{
  border-color:color-mix(in srgb,var(--accent) 30%,var(--border));
  background:var(--accent-soft);
  color:var(--text);
}

/* Metrics / progress */
.spark i{background:var(--accent)}
.progress{background:var(--surface-2)}
.progress>i{background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.metric,.kpi .value{font-variant-numeric:tabular-nums}
.qr{
  outline:3px solid var(--accent);
  border-color:var(--surface);
}

/* Public gym cards */
.gym-card,.feature-tile,.category-card{
  background:var(--surface);
  border-color:var(--border);
  box-shadow:var(--shadow-soft);
}
.gym-cover,.detail-cover{
  background:
    radial-gradient(circle at 82% 18%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 29%),
    linear-gradient(145deg,var(--surface-2),color-mix(in srgb,var(--accent-soft) 52%,var(--surface-2)));
}
.detail-cover{border-color:var(--border)}

/* Auth */
.auth-wrap{
  background:
    radial-gradient(circle at 50% 20%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 30%),
    var(--bg);
}
.auth-card{
  border-radius:22px;
  box-shadow:var(--shadow);
}
.link-btn{color:var(--accent-strong)}
.divider:before,.divider:after{background:var(--border)}

/* Auth bottom sheet */
.auth-backdrop{background:rgba(0,0,0,.58)}
.auth-sheet{
  background:var(--surface);
  border-color:var(--border);
}
.sheet-icon{
  background:var(--accent-soft)!important;
  color:var(--accent-strong);
}

/* Typography */
.screen-title h1,.section-title h2,.hero h1,.guest-hero h1{
  letter-spacing:-.04em;
}
.row-title,.card h3,.kpi .value{font-weight:780}

/* --------------------------------------------------------------
   Splash: restrained rotating dumbbell. No character, no bounce.
   -------------------------------------------------------------- */
.launch-splash{
  background:
    radial-gradient(circle at 50% 44%,color-mix(in srgb,var(--accent) 6%,transparent),transparent 26%),
    var(--bg);
}
.launch-splash:before{display:none}
.launch-logo{display:none}
.launch-name{
  font-size:38px;
  letter-spacing:-2px;
}
.launch-name:after{
  content:"";
  display:inline-block;
  width:8px;height:8px;
  margin-left:5px;
  border-radius:50%;
  background:var(--accent);
  vertical-align:middle;
  transform:translateY(-2px);
}
.launch-tagline{
  margin-top:8px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  font-size:10px;
}
.launch-loader,.launch-status{display:none}
.splash-dumbbell{
  width:108px;
  height:108px;
  margin-top:36px;
  position:relative;
  display:grid;
  place-items:center;
  animation:splashRotate 3.2s linear infinite;
}
.splash-db-handle{
  position:absolute;
  width:60px;height:8px;
  border-radius:999px;
  background:linear-gradient(180deg,var(--text),color-mix(in srgb,var(--text) 55%,var(--muted)));
}
.splash-db-side{
  position:absolute;
  top:50%;
  width:18px;height:42px;
  margin-top:-21px;
  border-radius:5px;
  background:linear-gradient(180deg,var(--accent),var(--accent-2));
}
.splash-db-side.left{left:12px}
.splash-db-side.right{right:12px}
.splash-db-side:before{
  content:"";
  position:absolute;
  top:7px;
  width:8px;height:28px;
  border-radius:4px;
  background:color-mix(in srgb,var(--text) 82%,var(--surface));
}
.splash-db-side.left:before{right:-10px}
.splash-db-side.right:before{left:-10px}
.splash-loading-label{
  margin-top:18px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.7px;
  text-transform:uppercase;
}
@keyframes splashRotate{
  to{transform:rotate(360deg)}
}

/* Accessibility */
button:focus-visible,.row:focus-visible,.category-card:focus-visible{
  outline:none;
  box-shadow:var(--ring);
}


@media(min-width:700px){
  body{padding:28px 0}
  #app{min-height:calc(100dvh - 56px);border-radius:30px;box-shadow:0 30px 90px rgba(0,0,0,.18);overflow:hidden}
  .bottom-nav{bottom:28px}
}

/* ==============================================================
   GYMZO RESPONSIVE WEB SYSTEM
   Mobile-first:
   0–599px      phones
   600–899px    tablets / small landscape
   900–1199px   compact desktop with navigation rail
   1200–1599px  full desktop with sidebar
   1600px+      wide desktop
   ============================================================== */

/* Base/mobile cleanup */
body{padding:0}
#app{
  width:100%;
  max-width:none;
  margin:0;
  min-height:100dvh;
  border-radius:0;
  box-shadow:none;
  overflow:visible;
}
.content{
  width:100%;
  max-width:100%;
}
.auth-wrap{
  width:100%;
  max-width:520px;
  margin:0 auto;
}
.screen-title{
  position:relative;
}

/* Keep tap targets comfortable */
.nav-btn,.tab,.context-pill,.guest-chip,.save-btn,.category-card{
  min-height:42px;
}

/* PHONE */
@media (max-width:599px){
  .topbar{padding:11px 14px}
  .content{padding:16px 14px 98px}

  .hero,.guest-hero{padding:20px}
  .hero h1,.guest-hero h1{font-size:28px}

  .grid,.feature-list,.kpi-grid{gap:10px}
  .category-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .h-scroll{
    margin-left:-14px;
    margin-right:-14px;
    padding-left:14px;
    padding-right:14px;
  }
  .gym-card{min-width:min(76vw,270px);max-width:min(76vw,270px)}

  .bottom-nav{
    width:100%;
    bottom:0;
    left:0;
    transform:none;
  }

  .auth-sheet{
    width:100%;
  }

  .detail-cover{height:175px}
  .qr{width:min(210px,62vw)}
}

/* TABLET */
@media (min-width:600px) and (max-width:899px){
  body{padding:0}
  #app{
    min-height:100dvh;
    border-radius:0;
    box-shadow:none;
    overflow:visible;
  }

  .topbar{
    padding:14px 24px;
  }
  .content{
    max-width:820px;
    margin:0 auto;
    padding:24px 24px 112px;
  }

  .hero,.guest-hero{
    padding:26px;
  }
  .hero h1,.guest-hero h1{font-size:34px}

  .category-grid{
    grid-template-columns:repeat(6,minmax(0,1fr));
  }
  .feature-list{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
  .kpi-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .h-scroll{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    overflow:visible;
  }
  .gym-card{
    min-width:0;
    max-width:none;
    width:100%;
  }

  .bottom-nav{
    width:min(760px,calc(100% - 32px));
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:var(--shadow);
  }

  .list{
    gap:12px;
  }
  .row{padding:15px 16px}

  .auth-wrap{
    max-width:560px;
    padding-left:24px;
    padding-right:24px;
  }
}

/* DESKTOP NAVIGATION RAIL */
@media (min-width:900px){
  body{padding:0}
  #app{
    min-height:100dvh;
    border-radius:0;
    box-shadow:none;
    overflow:visible;
  }

  .safe-top{display:none}

  .topbar{
    margin-left:92px;
    width:calc(100% - 92px);
    min-height:72px;
    padding:14px 28px;
    position:sticky;
    top:0;
  }

  .content{
    margin-left:92px;
    width:calc(100% - 92px);
    max-width:none;
    padding:28px 30px 56px;
  }

  .bottom-nav{
    position:fixed;
    z-index:40;
    left:0;
    top:0;
    bottom:0;
    transform:none;
    width:92px;
    height:100dvh;
    padding:82px 10px 18px;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    gap:8px;
    border-top:0;
    border-right:1px solid var(--border);
    background:var(--surface);
    backdrop-filter:blur(18px);
  }
  .bottom-nav:before{
    content:"G";
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%) skewX(-9deg);
    width:42px;
    height:42px;
    border-radius:13px;
    display:grid;
    place-items:center;
    background:var(--accent);
    color:#10140D;
    font-size:22px;
    font-weight:1000;
  }

  .nav-btn{
    width:100%;
    min-height:62px;
    padding:8px 4px;
    flex-direction:column;
    justify-content:center;
    border-radius:14px;
    font-size:10px;
  }
  .nav-btn .ico{font-size:20px}

  .hero,.guest-hero{
    padding:30px;
  }
  .hero h1,.guest-hero h1{
    font-size:38px;
  }

  .category-grid{
    grid-template-columns:repeat(6,minmax(0,1fr));
  }
  .feature-list{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
  .kpi-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .h-scroll{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    overflow:visible;
    gap:14px;
  }
  .gym-card{
    min-width:0;
    max-width:none;
    width:100%;
  }

  .list{
    gap:12px;
  }

  /* Forms should not become uncomfortably wide */
  .form{
    max-width:780px;
  }

  /* Center auth as a web card */
  .auth-wrap{
    max-width:560px;
    min-height:100dvh;
    padding-top:48px;
    padding-bottom:48px;
  }

  /* Authentication gate becomes a modal instead of a mobile sheet */
  .auth-backdrop{
    align-items:center;
    padding:24px;
  }
  .auth-sheet{
    width:min(480px,100%);
    border-radius:26px;
    padding:12px 22px 24px;
  }

  .floating-add{
    right:32px;
    bottom:32px;
  }
}

/* FULL DESKTOP */
@media (min-width:1200px){
  .topbar{
    margin-left:210px;
    width:calc(100% - 210px);
    padding-left:34px;
    padding-right:34px;
  }

  .content{
    margin-left:210px;
    width:calc(100% - 210px);
    padding:32px 36px 64px;
  }

  .bottom-nav{
    width:210px;
    padding:88px 16px 22px;
    gap:7px;
  }
  .bottom-nav:before{
    left:24px;
    transform:skewX(-9deg);
  }
  .bottom-nav:after{
    content:"GYMZO";
    position:absolute;
    top:28px;
    left:78px;
    color:var(--text);
    font-size:18px;
    font-weight:950;
    letter-spacing:-.7px;
  }

  .nav-btn{
    min-height:50px;
    padding:10px 13px;
    flex-direction:row;
    justify-content:flex-start;
    gap:12px;
    font-size:12px;
    text-align:left;
  }
  .nav-btn .ico{
    width:24px;
    font-size:19px;
    text-align:center;
  }

  /* Web layout width: large enough for data dashboards,
     constrained enough to preserve hierarchy */
  .content > *{
    max-width:1280px;
    margin-left:auto;
    margin-right:auto;
  }

  .hero,.guest-hero{
    padding:34px 36px;
  }
  .hero h1,.guest-hero h1{
    font-size:42px;
    max-width:760px;
  }
  .hero p,.guest-hero p{
    max-width:650px;
  }

  .h-scroll{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .card.action-card{
    min-height:165px;
  }

  .kpi{
    padding:18px;
  }
  .kpi .value{
    font-size:26px;
  }

  .detail-cover{
    height:230px;
  }

  .qr{
    width:230px;
  }
}

/* WIDE DESKTOP / ULTRAWIDE */
@media (min-width:1600px){
  .content{
    padding-left:48px;
    padding-right:48px;
  }
  .content > *{
    max-width:1460px;
  }

  .h-scroll{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .hero,.guest-hero{
    padding:38px 42px;
  }
}

/* LANDSCAPE PHONE */
@media (max-width:899px) and (orientation:landscape) and (max-height:560px){
  .topbar{position:relative}
  .content{padding-bottom:84px}

  .bottom-nav{
    padding-top:6px;
    padding-bottom:6px;
  }
  .nav-btn{
    min-height:44px;
    flex-direction:row;
    justify-content:center;
    gap:6px;
  }

  .launch-splash{
    min-height:100dvh;
    justify-content:center;
    padding:16px;
  }
  .launch-name{font-size:30px}
  .splash-dumbbell{
    width:82px;
    height:82px;
    margin-top:20px;
  }
}

/* Touch/coarse pointer behavior */
@media (hover:hover) and (pointer:fine){
  .row,.card,.category-card,.gym-card,.nav-btn,.cta,.context-pill{
    transition:
      transform .16s ease,
      border-color .16s ease,
      background-color .16s ease,
      box-shadow .16s ease;
  }
  .row:hover,.category-card:hover,.gym-card:hover{
    transform:translateY(-1px);
  }
  .cta:hover{
    transform:translateY(-1px);
  }
}

/* Respect reduced-motion preference */
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{
    scroll-behavior:auto!important;
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
  }
}


/* ==============================================================
   GYMZO WEB NAVIGATION V2
   Large screens: horizontal top navigation
   Small screens: hamburger + slide-over menu
   No permanent side panel.
   ============================================================== */

.brand-button{
  appearance:none;
  border:0;
  background:transparent;
  color:var(--text);
  padding:0;
  display:flex;
  align-items:center;
  gap:11px;
  cursor:pointer;
  flex:0 0 auto;
}
.brand-word{
  font-size:18px;
  line-height:1;
  font-weight:950;
  letter-spacing:-.75px;
}

.desktop-nav{
  display:none;
  align-items:center;
  justify-content:center;
  gap:5px;
  min-width:0;
}
.desktop-nav-link{
  appearance:none;
  border:0;
  background:transparent;
  color:var(--muted);
  border-radius:12px;
  min-height:42px;
  padding:0 14px;
  font-size:13px;
  font-weight:720;
  cursor:pointer;
  white-space:nowrap;
}
.desktop-nav-link:hover{
  color:var(--text);
  background:var(--surface-2);
}
.desktop-nav-link.active{
  color:#10140D;
  background:var(--accent);
}
.desktop-auth{display:none}

.mobile-menu-trigger{
  appearance:none;
  border:1px solid var(--border);
  width:42px;
  height:42px;
  border-radius:13px;
  background:var(--surface);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  cursor:pointer;
  box-shadow:var(--shadow-soft);
}
.mobile-menu-trigger span{
  width:17px;
  height:2px;
  border-radius:99px;
  background:var(--text);
}

/* Mobile menu */
.mobile-menu-layer{
  position:fixed;
  inset:0;
  z-index:100;
  visibility:hidden;
  pointer-events:none;
}
.mobile-menu-layer.open{
  visibility:visible;
  pointer-events:auto;
}
.mobile-menu-backdrop{
  position:absolute;
  inset:0;
  width:100%;
  border:0;
  background:rgba(0,0,0,.56);
  opacity:0;
  transition:opacity .22s ease;
}
.mobile-menu-layer.open .mobile-menu-backdrop{opacity:1}

.mobile-menu-panel{
  position:absolute;
  top:0;
  right:0;
  bottom:0;
  width:min(360px,88vw);
  background:var(--surface);
  border-left:1px solid var(--border);
  box-shadow:-24px 0 60px rgba(0,0,0,.24);
  padding:max(18px,env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  transform:translateX(102%);
  transition:transform .24s cubic-bezier(.4,0,.2,1);
}
.mobile-menu-layer.open .mobile-menu-panel{
  transform:translateX(0);
}
.mobile-menu-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.mobile-menu-close{
  appearance:none;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text);

<body>
<div id="app"></div>

<script>
const ACCENT = '#b8f000';
const state = {
  theme: localStorage.getItem('gymzo-theme') || 'dark',
  route: 'boot',
  context: localStorage.getItem('gymzo-last-context') || 'guest', // guest | personal | member | owner
  authenticated: localStorage.getItem('gymzo-authenticated') === '1',
  user: {
    name: localStorage.getItem('gymzo-user-name') || 'Umar',
    phone: '+91 98765 43210'
  },
  gym: localStorage.getItem('gymzo-member-gym') || null,
  ownerGym: localStorage.getItem('gymzo-owner-gym') || null,
  selectedGym: 'Iron Core Fitness',
  authGate: null,
  pendingAuth: null,
  savedGyms: JSON.parse(localStorage.getItem('gymzo-saved-gyms') || '[]'),
  mobileMenuOpen: false,
  members: [
    {name:'Amit Verma', plan:'Gold Plan', status:'Active', due:'26 Sep'},
    {name:'Priya Patel', plan:'Premium Plan', status:'Expiring', due:'3 days'},
    {name:'Rahul Singh', plan:'Silver Plan', status:'Expired', due:'Expired'},
    {name:'Sneha Reddy', plan:'Gold Plan', status:'Active', due:'18 Oct'}
  ]
};
document.body.classList.toggle('dark', state.theme==='dark');

const app = document.getElementById('app');
const el = (html)=>{ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; };
const money = n => '₹' + Number(n).toLocaleString('en-IN');

function go(route, context){
  if(context){
    state.context = context;
    localStorage.setItem('gymzo-last-context', context);
  }
  state.mobileMenuOpen = false;
  state.route = route;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function toggleTheme(){
  state.theme = state.theme==='dark'?'light':'dark';
  localStorage.setItem('gymzo-theme',state.theme);
  document.body.classList.toggle('dark',state.theme==='dark');
  render();
}
function getNavigationItems(){
  const configs = {
    guest: [
      ['guest-home','Home'],['explore','Explore'],['guest-workouts','Workouts'],['saved','Saved'],['guest-profile','Profile']
    ],
    personal: [
      ['home','Home'],['explore','Explore'],['notifications','Notifications'],['profile','Profile'],['more','More']
    ],
    member: [
      ['member-home','Home'],['workouts','Workout'],['attendance','Check-in'],['payments','Payments'],['profile','Profile']
    ],
    owner: [
      ['owner-home','Dashboard'],['members','Members'],['owner-attendance','Attendance'],['owner-payments','Payments'],['owner-more','More']
    ]
  };
  return configs[state.context] || configs.guest;
}

function topbar(title='GYMZO'){
  const navItems = getNavigationItems();

  return `
  <div class="safe-top"></div>
  <div class="topbar">
    <button class="brand-button" onclick="go('${state.authenticated ? (state.context==='owner'?'owner-home':state.context==='member'?'member-home':'home') : 'guest-home'}','${state.authenticated ? state.context : 'guest'}')" aria-label="Gymzo home">
      <div class="logo-mark">G</div>
      <span class="brand-word">GYMZO</span>
    </button>

    <nav class="desktop-nav" aria-label="Primary navigation">
      ${navItems.map(([route,label])=>`
        <button
          class="desktop-nav-link ${state.route===route?'active':''}"
          onclick="go('${route}')"
        >${label}</button>
      `).join('')}
    </nav>

    <div class="top-actions">
      ${!state.authenticated ? `<button class="guest-chip desktop-auth" onclick="go('login','guest')">SIGN IN</button>` : ''}
      <button class="icon-btn theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">${state.theme==='dark'?'☀️':'🌙'}</button>
      <button class="mobile-menu-trigger" onclick="toggleMobileMenu()" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>`;
}
function toggleMobileMenu(){
  state.mobileMenuOpen = !state.mobileMenuOpen;
  render();
}
function closeMobileMenu(){
  state.mobileMenuOpen = false;
  render();
}
function mobileNavigate(route){
  state.mobileMenuOpen = false;
  go(route);
}

function bottomNav(){
  const items = getNavigationItems();

  return `
    <div class="mobile-menu-layer ${state.mobileMenuOpen?'open':''}">
      <button class="mobile-menu-backdrop" onclick="closeMobileMenu()" aria-label="Close menu"></button>

      <aside class="mobile-menu-panel" aria-label="Mobile navigation">
        <div class="mobile-menu-head">
          <div class="logo"><div class="logo-mark">G</div><span>GYMZO</span></div>
          <button class="mobile-menu-close" onclick="closeMobileMenu()" aria-label="Close menu">×</button>
        </div>

        <div class="mobile-menu-context">
          <span class="badge accent">${state.authenticated ? state.context.toUpperCase() : 'GUEST'}</span>
          <div class="small">${state.authenticated ? 'Your Gymzo workspace' : 'Explore Gymzo freely'}</div>
        </div>

        <nav class="mobile-menu-links">
          ${items.map(([route,label],index)=>`
            <button
              class="mobile-menu-link ${state.route===route?'active':''}"
              onclick="mobileNavigate('${route}')"
            >
              <span class="mobile-menu-index">${String(index+1).padStart(2,'0')}</span>
              <span>${label}</span>
              <span class="chev">›</span>
            </button>
          `).join('')}
        </nav>

        ${!state.authenticated ? `
          <div class="mobile-menu-auth">
            <button class="cta secondary" onclick="state.mobileMenuOpen=false;go('login','guest')">SIGN IN</button>
            <button class="cta" onclick="state.mobileMenuOpen=false;go('signup','guest')">CREATE ACCOUNT</button>
          </div>
        ` : `
          <div class="mobile-menu-auth">
            <button class="cta secondary" onclick="state.mobileMenuOpen=false;go('profile')">ACCOUNT</button>
          </div>
        `}
      </aside>
    </div>
  `;
}
function shell(content,title='GYMZO',nav=true){
  return `${topbar(title)}<main class="content">${content}</main>${nav?bottomNav():''}${authGateHtml()}`;
}

function authGateHtml(){
  if(!state.authGate) return '';
  return `
    <div class="auth-backdrop" onclick="closeAuthGate(event)">
      <div class="auth-sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <div class="sheet-icon">🔐</div>
        <h2>Continue with Gymzo</h2>
        <p>${state.authGate.message || 'Sign in or create an account to continue with this action.'}</p>
        <div class="sheet-actions">
          <button class="cta secondary" onclick="continueToAuth('login')">SIGN IN</button>
          <button class="cta" onclick="continueToAuth('signup')">CREATE ACCOUNT</button>
        </div>
        <button class="sheet-later" onclick="dismissAuthGate()">Not now</button>
      </div>
    </div>`;
}

function openAuthGate(route, context='personal', message='Sign in or create an account to continue.'){
  state.pendingAuth = {route, context};
  state.authGate = {message};
  render();
}
function dismissAuthGate(){
  state.authGate = null;
  render();
}
function closeAuthGate(event){
  if(event && event.target !== event.currentTarget) return;
  dismissAuthGate();
}
function continueToAuth(type){
  state.authGate = null;
  go(type,'guest');
}
function protectedGo(route, context='personal', message='Sign in or create an account to continue.'){
  if(!state.authenticated){
    openAuthGate(route, context, message);
    return;
  }
  go(route, context);
}

      </div>

        <button class="cta secondary">G&nbsp;&nbsp; Google</button>

        ${signup?'Already have an account?':'New to Gymzo?'}
        <button class="link-btn" onclick="go('${signup?'login':'signup'}')">${signup?'Login':'Sign up'}</button>
      </div>
      <button class="cta ghost" style="margin-top:8px" onclick="state.pendingAuth=null;go('guest-home','guest')">CONTINUE AS GUEST</button>
    </div>
    <button class="icon-btn theme-toggle" style="position:fixed;right:18px;top:18px" onclick="toggleTheme()">${state.theme==='dark'?'☀️':'🌙'}</button>
  </div>`;
}
function loginUser(){
  state.authenticated = true;
  localStorage.setItem('gymzo-authenticated', '1');

  if(state.pendingAuth){
    const destination = {...state.pendingAuth};
    state.pendingAuth = null;
    go(destination.route, destination.context);
    return;
  }

  const destination = getPostLaunchRoute();
  go(destination.route, destination.context);
}

function signupUser(){
  const name = document.getElementById('name')?.value?.trim();
  if(name){
    state.user.name = name;
    localStorage.setItem('gymzo-user-name', name);
  }
  state.authenticated = true;
  localStorage.setItem('gymzo-authenticated', '1');
  localStorage.setItem('gymzo-last-context', 'personal');

  if(state.pendingAuth){
    const destination = {...state.pendingAuth};
    state.pendingAuth = null;
    go(destination.route, destination.context);
    return;
  }

  go('home','personal');
}

  {name:'Fit Nation',distance:'2.8 km',rating:'4.6',price:999,area:'Versova',icon:'⚡',amenities:['Cardio','Zumba','Yoga']},

];

function openGym(name){
  state.selectedGym = name;
  go('gym-detail', state.authenticated ? state.context : 'guest');
}
function selectedGym(){
  return PUBLIC_GYMS.find(g=>g.name===state.selectedGym) || PUBLIC_GYMS[0];
}
function isSaved(name){
  return state.savedGyms.includes(name);
}
function toggleSaved(name){
  if(isSaved(name)){
    state.savedGyms = state.savedGyms.filter(x=>x!==name);
  }else{
    state.savedGyms = [...state.savedGyms, name];
  }
  localStorage.setItem('gymzo-saved-gyms', JSON.stringify(state.savedGyms));
  render();
}
function publicGymCard(g){

function render(){
  const protectedRoutes = new Set([
    'join-gym','register-gym','member-home','membership','payments','attendance','workouts','diet','notifications','profile','more',
    'owner-home','members','add-member','memberships-owner','owner-payments','owner-attendance','analytics','owner-more','trainers','settings'
  ]);

  if(!state.authenticated && protectedRoutes.has(state.route)){
    const requested = state.route;
    state.pendingAuth = state.pendingAuth || {route:requested, context:'personal'};
    state.route = 'guest-home';
    state.context = 'guest';
    state.authGate = state.authGate || {message:'Sign in or create an account to use this Gymzo feature.'};
  }

  const routes = {
    'boot':launchSplash,
    'login':()=>authScreen('login'),
    'signup':()=>authScreen('signup'),

    'guest-home':guestHome,
    'gym-detail':gymDetail,
    'guest-workouts':guestWorkouts,
    'public-workout-detail':publicWorkoutDetail,
    'saved':savedPage,
    'guest-profile':guestProfile,
    'public-trainers':publicTrainers,
    'public-classes':publicClasses,
    'public-plans':publicPlans,
    'public-offers':publicOffers,

    'home':universalHome,
    'join-gym':joinGym,
    'register-gym':registerGym,
    'member-home':memberHome,
    'membership':membership,
    'payments':payments,
    'attendance':()=>attendance(true),
    'workouts':workouts,
    'diet':diet,
    'notifications':notifications,
    'profile':profile,
    'explore':explore,
    'more':profile,
    'owner-home':ownerHome,
    'members':members,
    'add-member':addMember,
    'memberships-owner':membershipsOwner,
    'owner-payments':ownerPayments,
    'owner-attendance':ownerAttendance,
    'analytics':analytics,
    'owner-more':ownerMore,
    'trainers':trainers,
    'settings':settings
  };
  app.innerHTML = (routes[state.route] || guestHome)();
}

const MIN_SPLASH_TIME = 800;

function sleep(ms){
  return new Promise(resolve => window.setTimeout(resolve, ms));
}

function getPostLaunchRoute(){
  if(!state.authenticated){
    return {route:'guest-home', context:'guest'};
  }

  const hasMemberContext = Boolean(state.gym);
  const hasOwnerContext = Boolean(state.ownerGym);
  const last = localStorage.getItem('gymzo-last-context') || 'personal';

  if(last === 'owner' && hasOwnerContext){
    return {route:'owner-home', context:'owner'};
  }
  if(last === 'member' && hasMemberContext){
    return {route:'member-home', context:'member'};
  }

  return {route:'home', context:'personal'};
}

async function initializeApp(){
  // Every fresh page/app launch starts with the branded splash.
  // Returning to an already-open tab does not restart the splash.
  state.route = 'boot';
  render();

  const restoreSession = (async () => {
    // Static prototype stand-in for auth token, profile and role hydration.
    await sleep(80);
    state.authenticated = localStorage.getItem('gymzo-authenticated') === '1';
    state.gym = localStorage.getItem('gymzo-member-gym') || null;
    state.ownerGym = localStorage.getItem('gymzo-owner-gym') || null;
    state.context = localStorage.getItem('gymzo-last-context') || (state.authenticated ? 'personal' : 'guest');
    return getPostLaunchRoute();
  })();

  const [destination] = await Promise.all([
    restoreSession,
    sleep(MIN_SPLASH_TIME)
  ]);

  go(destination.route, destination.context);
}

initializeApp();
